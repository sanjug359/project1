"<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>

    <style>
        body {
            background-color: rgb(251, 236, 246);
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .clock {
            margin-top: 150px;
        }

        h1 {
            color: rgb(92, 222, 66);
        }

        #time {
            font-size: 40px;
            color: rgb(231, 91, 246);
            background-color: rgb(238, 240, 128);
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="clock">
        <h1>Digital Clock</h1>
        <div id="time">00:00:00 AM</div>
    </div>

    <script>
        function showTime() {
            let date = new Date();
            let time = date.toLocaleTimeString('en-US');
            document.getElementById("time").innerHTML = time;
        }

        setInterval(showTime, 1000);
        showTime();
    </script>
</body>
</html>"
